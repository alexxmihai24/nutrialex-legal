<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NutriAlex AI</title>
<!-- La app la muestra dentro de una WebView en Crear cuenta / Iniciar sesión / Olvidé mi contraseña.
     Turnstile (Cloudflare) comprueba que no es un robot; el token va a Supabase, que lo valida con la clave secreta. -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=init&render=explicit" async defer></script>
<style>
  html, body { margin: 0; padding: 0; background: #0a1a0a; }
  body { display: flex; justify-content: center; align-items: center; min-height: 70px; }
</style>
</head>
<body>
<div id="widget"></div>
<script>
  // Clave pública del sitio de Turnstile (widget "NutriAlex", hostname alexxmihai24.github.io).
  // La de prueba de Cloudflare, que siempre pasa, es '1x00000000000000000000AA'.
  var SITE_KEY = '0x4AAAAAAFnIxDBRWO-3i47x';
  // La app pasa su idioma (?lang=es|en|ro); sin el, el del movil.
  var LANG = new URLSearchParams(location.search).get('lang');
  if (['es', 'en', 'ro'].indexOf(LANG) < 0) LANG = 'auto';

  function send(msg) {
    if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(msg));
  }

  function init() {
    turnstile.render('#widget', {
      sitekey: SITE_KEY,
      theme: 'dark',
      language: LANG,
      callback: function (token) { send({ token: token }); },
      'expired-callback': function () { send({ expired: true }); },
      'error-callback': function () { send({ error: true }); },
    });
  }
</script>
</body>
</html>
